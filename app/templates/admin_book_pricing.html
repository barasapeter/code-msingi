<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pricing — {{ book.title }}</title><link rel="stylesheet" href="{{ url_for('static', path='css/site.css') }}"></head><body><main class="admin"><a class="back" href="/admin/dashboard">← Sales dashboard</a><h1>Edit price</h1><p>{{ book.title }}</p><form method="post"><label>Normal price (KES)<input type="number" name="price" min="0" step="0.01" value="{{ '%.2f'|format(book.price) }}" required></label><label><input type="checkbox" name="discount_enabled" value="true" {% if book.discount_enabled %}checked{% endif %}> Offer a limited discount</label><label>Discount amount (KES)<input type="number" name="discount_amount" min="0" step="0.01" value="{{ '%.2f'|format(book.discount_amount) }}"></label><label>Discount ends at<input type="datetime-local" name="discount_ends_at" value="{{ book.discount_ends_at.strftime('%Y-%m-%dT%H:%M') if book.discount_ends_at else '' }}"></label><p class="payment-note">The public price reverts to the normal price automatically when this time arrives.</p><button class="button" type="submit">Save pricing</button></form></main></body></html>
