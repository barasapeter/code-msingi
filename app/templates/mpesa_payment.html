<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>M-Pesa payment — {{ book.title }}</title><link rel="stylesheet" href="{{ url_for('static', path='css/site.css') }}"><link rel="stylesheet" href="{{ url_for('static', path='css/mpesa.css') }}"><script defer src="{{ url_for('static', path='js/mpesa.js') }}"></script></head>
<body class="mpesa-body"><main class="mpesa-page"><a class="back" href="/books/{{ book.id }}/checkout">← Back to checkout</a><section class="mpesa-card"><header><img src="{{ url_for('static', path='images/lipa-na-mpesa.png') }}" alt="Lipa na M-Pesa"><p>Secure M-Pesa payment</p></header><div class="mpesa-book">{% if book.thumbnail_path %}<img src="{{ book.thumbnail_path }}" alt="{{ book.title }} cover">{% endif %}<div><span>Payment for</span><strong>{{ book.title }}</strong><small>{{ book.author }}</small></div></div><div class="mpesa-summary"><span>Amount due</span><strong>KSh {{ '%.2f'|format(book.price) }}</strong></div><p id="payment-feedback" class="mpesa-message" aria-live="polite"></p><form id="mpesa-payment-form" method="post" data-payment-state='{{ payment_state|tojson if payment_state else "null" }}'><label>M-Pesa phone number<input name="phone_number" type="tel" inputmode="numeric" autocomplete="tel" placeholder="0712 345 678" value="{{ payment_state.phone_number if payment_state else '' }}" required></label><p class="payment-note">We will send a payment prompt to this number.</p><button class="mpesa-submit" type="submit">Send M-Pesa prompt</button></form></section></main></body></html>
