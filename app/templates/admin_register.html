<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Authorise uploader</title><link rel="stylesheet" href="{{ url_for('static', path='css/site.css') }}"></head><body><main class="admin"><a class="back" href="/admin/books/new">← Upload materials</a><h1>Authorise an uploader</h1><p>Add a Google account that may upload materials.</p><form method="post"><label>Google email address<input type="email" name="email" autocomplete="email" required></label><button class="button" type="submit">Authorise account</button></form><h2>Authorised uploaders</h2><ul>{% for admin in admins %}<li>{{ admin.email }}</li>{% else %}<li>No additional uploaders authorised.</li>{% endfor %}</ul></main></body></html>
